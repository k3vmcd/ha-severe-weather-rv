title: Severe Weather
path: severe-weather
icon: mdi:weather-lightning-rainy
type: sections
max_columns: 3
sections:
  - column_span: 2
    cards:
      - type: heading
        heading: Current Status
      - type: custom:mushroom-template-card
        primary: >-
          {{ states('sensor.severe_weather_rv_monitor_severe_weather_summary')
          }}
        secondary: '{{ states(''sensor.severe_weather_rv_monitor_top_alert_headline'') }}'
        icon: mdi:weather-lightning-rainy
        icon_color: >
          {% set s =
          states('sensor.severe_weather_rv_monitor_severe_weather_summary') %}
          {{ 'red' if 'EMERGENCY' in s or 'WARNING' in s
             else 'orange' if 'THREAT' in s or 'WATCH' in s
             else 'green' }}
        multiline_secondary: true
        tap_action:
          action: none
      - type: horizontal-stack
        cards:
          - type: custom:mushroom-template-card
            primary: Tornado
            secondary: >-
              {{ states('sensor.severe_weather_rv_monitor_tornado_threat_level')
              }}
            icon: mdi:weather-tornado
            fill_container: true
            icon_color: >
              {% set t =
              states('sensor.severe_weather_rv_monitor_tornado_threat_level') %}
              {{ 'red' if t in ['WARNING','EMERGENCY'] else 'orange' if t ==
              'WATCH' else 'green' }}
          - type: custom:mushroom-template-card
            primary: Hail / Tstorm
            secondary: >-
              {{
              states('sensor.severe_weather_rv_monitor_severe_thunderstorm_threat_level')
              }}
            icon: mdi:weather-hail
            fill_container: true
            icon_color: >
              {% set s =
              states('sensor.severe_weather_rv_monitor_severe_thunderstorm_threat_level')
              %} {{ 'red' if s == 'WARNING' else 'orange' if s == 'WATCH' else
              'green' }}
          - type: custom:mushroom-template-card
            primary: Hurricane
            secondary: >-
              {{
              states('sensor.severe_weather_rv_monitor_hurricane_threat_level')
              }}
            icon: mdi:weather-hurricane
            fill_container: true
            icon_color: >
              {% set h =
              states('sensor.severe_weather_rv_monitor_hurricane_threat_level')
              %} {{ 'red' if 'WARNING' in h or 'EMERGENCY' in h else 'orange' if
              'WATCH' in h else 'green' }}
      - type: glance
        show_name: true
        show_icon: true
        show_state: true
        columns: 6
        entities:
          - entity: sensor.severe_weather_rv_monitor_spc_day_1_risk
            name: SPC D1
          - entity: sensor.severe_weather_rv_monitor_spc_day_1_hail_risk
            name: Hail Day 1
          - entity: sensor.severe_weather_rv_monitor_spc_day_1_tornado_risk
            name: Tornado
          - entity: sensor.severe_weather_rv_monitor_spc_day_1_wind_risk
            name: Wind
          - entity: sensor.severe_weather_rv_monitor_nearest_storm_distance
            name: NHC Dist
          - entity: sensor.severe_weather_rv_monitor_alert_count
            name: Alerts
          - entity: sensor.severe_weather_rv_monitor_spc_day_2_risk
            name: SPC D2
          - entity: sensor.severe_weather_rv_monitor_spc_day_2_hail_risk
            name: Hail Day 2
          - entity: sensor.severe_weather_rv_monitor_spc_day_2_tornado_risk
            name: Tornado
          - entity: sensor.severe_weather_rv_monitor_spc_day_2_wind_risk
            name: Wind
        grid_options:
          columns: 15
          rows: auto
      - type: custom:mushroom-template-card
        primary: '{{ states(''sensor.severe_weather_rv_monitor_action_level'') }}'
        secondary: >-
          {% set reasons =
          state_attr('sensor.severe_weather_rv_monitor_action_level', 'reasons')
          %} {% if reasons and reasons | length > 0 %} {{ reasons | join(' | ')
          }} {% else %} No immediate severe weather action required. {% endif %}
        icon: >-
          {% set level = states('sensor.severe_weather_rv_monitor_action_level')
          %} {% if level == 'ACT NOW' %}mdi:shield-alert {% elif level ==
          'PREPARE' %}mdi:shield-sword {% elif level == 'MONITOR'
          %}mdi:shield-sync {% else %}mdi:shield-check{% endif %}
        multiline_secondary: true
        color: >-
          {% set level = states('sensor.severe_weather_rv_monitor_action_level')
          %} {% if level == 'ACT NOW' %}red {% elif level == 'PREPARE' %}orange
          {% elif level == 'MONITOR' %}amber {% else %}green{% endif %}
        features_position: bottom
  - cards:
      - type: heading
        heading: Location
      - type: custom:mushroom-template-card
        primary: >-
          {{ states('sensor.severe_weather_rv_monitor_alert_count') }} Active
          Alerts
        secondary: >
          {{ states('sensor.severe_weather_rv_monitor_monitored_latitude') }}°,
          {{ states('sensor.severe_weather_rv_monitor_monitored_longitude') }}°
        icon: mdi:map-marker-radius
      - type: custom:mushroom-template-card
        primary: >-
          {{ states('sensor.severe_weather_rv_monitor_nhc_active_storms') }}
          Named Storm(s)
        secondary: NHC Active Tropics
        icon: mdi:weather-hurricane
      - type: entities
        title: Peak Temperature
        show_header_toggle: false
        entities:
          - entity: sensor.pirateweather_daytime_high_temperature_time_0d
            name: Today Peak Heat
            secondary_info: state
          - entity: sensor.pirateweather_daily_low_temperature_time_0d
            name: Today Min Temp
            secondary_info: state
          - entity: sensor.pirateweather_daily_low_temperature_time_1d
            name: Overnight Min Temp
            secondary_info: state
  - type: grid
    cards:
      - type: heading
        heading: Current Conditions
      - show_current: true
        show_forecast: true
        type: weather-forecast
        entity: weather.pirateweather
        forecast_type: hourly
        forecast_slots: 12
        grid_options:
          columns: 24
          rows: 3
      - type: custom:mushroom-chips-card
        chips:
          - type: entity
            entity: sensor.pirateweather_temperature
            name: Temp
            icon_color: orange
          - type: entity
            entity: sensor.pirateweather_apparent_temperature
            name: Feels Like
            icon_color: deep-orange
          - type: entity
            entity: sensor.pirateweather_humidity
            name: Humidity
            icon_color: blue
          - type: entity
            entity: sensor.pirateweather_dew_point
            name: Dew Pt
            icon_color: cyan
          - type: entity
            entity: sensor.pirateweather_uv_index
            name: UV
            icon_color: yellow
          - type: entity
            entity: sensor.pirateweather_cloud_coverage
            name: Clouds
            icon_color: grey
        alignment: start
      - type: custom:mushroom-chips-card
        chips:
          - type: entity
            entity: sensor.pirateweather_wind_speed
            name: Wind
            icon_color: green
          - type: entity
            entity: sensor.pirateweather_wind_gust
            name: Gust
            icon_color: red
          - type: entity
            entity: sensor.pirateweather_wind_bearing
            name: Dir
            icon_color: teal
          - type: entity
            entity: sensor.pirateweather_nearest_storm_distance
            name: Storm
            icon_color: purple
          - type: entity
            entity: sensor.pirateweather_precip_intensity
            name: Precip
            icon_color: indigo
          - type: entity
            entity: sensor.pirateweather_precip_probability
            name: Prob
            icon_color: light-blue
        alignment: start
      - type: entities
        show_header_toggle: false
        entities:
          - entity: sensor.pirateweather_minutely_summary
            name: ⏱ Next Hour
          - entity: sensor.pirateweather_hourly_summary
            name: 🕐 Next 24h
          - entity: sensor.pirateweather_daily_summary
            name: 📅 This Week
          - entity: sensor.pirateweather_summary
            name: 📍 Currently
      - entity_apparent_temp: sensor.pirateweather_apparent_temperature
        entity_extended: sensor.pirateweather_minutely_summary
        entity_forecast_icon: sensor.pirateweather_icon
        entity_forecast_icon_1: sensor.pirateweather_icon_1d
        entity_forecast_max: sensor.pirateweather_daytime_high_temperature_0d
        entity_forecast_max_1: sensor.pirateweather_daytime_high_temperature_1d
        entity_forecast_min: sensor.pirateweather_overnight_low_temperature_0d
        entity_forecast_min_1: sensor.pirateweather_overnight_low_temperature_1d
        entity_humidity: sensor.pirateweather_humidity
        entity_pop: sensor.pirateweather_precip_probability
        entity_pop_1: sensor.pirateweather_precip_probability_1d
        entity_pos: sensor.pirateweather_precip_accumulation_0d
        entity_pos_1: sensor.pirateweather_precip_accumulation_1d
        entity_pressure: weather.pirateweather
        entity_summary: sensor.pirateweather_summary
        entity_summary_1: sensor.pirateweather_summary_1d
        entity_sun: sun.sun
        entity_temperature: sensor.pirateweather_temperature
        entity_uv_alert_summary: sensor.pirateweather_uv_index
        entity_wind_bearing: sensor.pirateweather_wind_bearing
        entity_wind_gust: sensor.pirateweather_wind_gust
        entity_wind_speed: sensor.pirateweather_wind_speed
        section_order:
          - overview
          - extended
          - slots
          - daily_forecast
        show_section_extended: true
        type: custom:platinum-weather-card
    column_span: 2
  - cards:
      - type: heading
        heading: Active Alerts
      - type: conditional
        conditions:
          - condition: state
            entity: binary_sensor.severe_weather_rv_monitor_any_weather_alert_active
            state: 'on'
        card:
          type: markdown
          title: Active NWS Alerts
          content: >
            {% set alerts =
            state_attr('sensor.severe_weather_rv_monitor_top_alert_headline',
            'all_alerts') or [] %} {% if alerts | length == 0 %} ✅ No active
            alerts. {% else %} {% for a in alerts %} **{{ a.event }}** — {{
            a.severity }} *{{ a.headline }}* Expires: {{ a.expires }} --- {%
            endfor %} {% endif %}
      - type: heading
        heading: Forecast
        heading_style: title
      - type: custom:weather-chart-card
        entity: weather.pirateweather
        show_main: true
        show_attributes: true
        animated_icons: true
        feels_like_sensor: sensor.pirateweather_apparent_temperature
        dew_point_sensor: sensor.pirateweather_dew_point
        wind_speed_sensor: sensor.pirateweather_wind_speed
        wind_bearing_sensor: sensor.pirateweather_wind_bearing
        wind_gust_speed_sensor: sensor.pirateweather_wind_gust
        uv_index_sensor: sensor.pirateweather_uv_index
        weather_description_sensor: sensor.pirateweather_summary
  - column_span: 1
    cards:
      - type: heading
        heading: SPC Day 1
        heading_style: title
      - show_state: false
        show_name: true
        fit_mode: cover
        type: picture-entity
        entity: image.severe_weather_rv_monitor_spc_day_1_categorical_outlook
        name: Day 1 Categorical
        hold_action:
          action: url
          url_path: https://www.spc.noaa.gov/products/outlook/day1otlk.html
      - show_state: false
        show_name: true
        fit_mode: cover
        type: picture-entity
        entity: image.severe_weather_rv_monitor_spc_day_1_hail_probability
        name: Day 1 Hail Probability
        hold_action:
          action: url
          url_path: https://www.spc.noaa.gov/products/outlook/day1otlk.html
      - show_state: false
        show_name: true
        fit_mode: cover
        type: picture-entity
        entity: image.severe_weather_rv_monitor_spc_day_1_tornado_probability
        name: Day 1 Tornado Probability
        hold_action:
          action: url
          url_path: https://www.spc.noaa.gov/products/outlook/day1otlk.html
      - type: picture-entity
        entity: image.severe_weather_rv_monitor_spc_day_1_wind_probability
        name: Wind Probability
        show_state: false
        hold_action:
          action: url
          url_path: https://www.spc.noaa.gov/products/outlook/day1otlk.html
  - cards:
      - type: heading
        heading: SPC Day 2 Outlook
      - type: picture-entity
        entity: image.severe_weather_rv_monitor_spc_day_2_categorical_outlook
        name: Day 2 Categorical
        show_state: false
        hold_action:
          action: url
          url_path: https://www.spc.noaa.gov/products/outlook/day2otlk.html
      - type: picture-entity
        entity: image.severe_weather_rv_monitor_spc_day_2_hail_probability
        name: Day 2 Hail Prob
        show_state: false
        hold_action:
          action: url
          url_path: https://www.spc.noaa.gov/products/outlook/day2otlk.html
      - type: picture-entity
        entity: image.severe_weather_rv_monitor_spc_day_2_tornado_probability
        name: Day 2 Tornado Prob
        show_state: false
        hold_action:
          action: url
          url_path: https://www.spc.noaa.gov/products/outlook/day2otlk.html
      - type: picture-entity
        entity: image.severe_weather_rv_monitor_spc_day_2_wind_probability
        name: Wind Probability
        show_state: false
        hold_action:
          action: url
          url_path: https://www.spc.noaa.gov/products/outlook/day2otlk.html
  - column_span: 1
    cards:
      - type: heading
        heading: SPC Day 3 Outlook
      - type: picture-entity
        entity: image.severe_weather_rv_monitor_spc_day_3_categorical_outlook
        name: Day 3 Categorical
        show_state: false
        hold_action:
          action: url
          url_path: https://www.spc.noaa.gov/products/outlook/day3otlk.html
      - type: heading
        heading: Tropical / Hurricane Outlook
      - type: picture-entity
        entity: image.severe_weather_rv_monitor_nhc_atlantic_2_day_tropical_outlook
        name: Atlantic 2-Day
        show_state: false
        hold_action:
          action: url
          url_path: https://www.nhc.noaa.gov
      - type: picture-entity
        entity: image.severe_weather_rv_monitor_nhc_atlantic_7_day_tropical_outlook
        name: Atlantic 7-Day
        show_state: false
        hold_action:
          action: url
          url_path: https://www.nhc.noaa.gov
      - type: picture-entity
        entity: >-
          image.severe_weather_rv_monitor_nhc_eastern_pacific_2_day_tropical_outlook
        name: Eastern Pacific 2-Day
        show_state: false
        hold_action:
          action: url
          url_path: https://www.nhc.noaa.gov
  - type: grid
    cards:
      - type: heading
        heading: Live Radar
        heading_style: title
        icon: mdi:radar
      - type: custom:config-template-card
        variables:
          LAT: states['sensor.severe_weather_rv_monitor_monitored_latitude'].state
          LON: states['sensor.severe_weather_rv_monitor_monitored_longitude'].state
        entities:
          - sensor.severe_weather_rv_monitor_monitored_latitude
          - sensor.severe_weather_rv_monitor_monitored_longitude
        card:
          type: iframe
          url: >-
            ${"https://www.rainviewer.com/map.html?loc=" + LAT + "," + LON +
            ",9&oC=true&oCS=1&oF=1&c=9&o=83&lm=1&layer=radar&sm=1&sn=1"}
          aspect_ratio: 50%
        grid_options:
          columns: full
          rows: full
      - type: custom:config-template-card
        variables:
          LAT: states['sensor.severe_weather_rv_monitor_monitored_latitude'].state
          LON: states['sensor.severe_weather_rv_monitor_monitored_longitude'].state
        entities:
          - sensor.severe_weather_rv_monitor_monitored_latitude
          - sensor.severe_weather_rv_monitor_monitored_longitude
        card:
          type: iframe
          url: >-
            ${"https://embed.windy.com/embed.html?type=map&location=coordinates&metricRain=in&metricTemp=°F&metricWind=mph&zoom=10&overlay=radar&product=radar&level=surface&lat="
            + LAT + "&lon=" + LON + "&detailLat=" + LAT + "&detailLon=" + LON +
            "&detail=false&marker=true&pressure=true&message=true"}
          aspect_ratio: 100%
        grid_options:
          columns: full
          rows: full
    column_span: 2
cards: []
